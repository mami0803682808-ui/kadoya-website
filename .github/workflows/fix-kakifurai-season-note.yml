name: Fix kakifurai season note
on:
  push:
    paths:
      - '.github/workflows/fix-kakifurai-season-note.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update kakifurai season note
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<h3>カキフライ定食 <span class="item-season-note">（10月〜4月限定）</span></h3></article>'
          new = '<h3>カキフライ定食</h3><p class="menu-note">10月〜4月限定</p></article>'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Format kakifurai seasonal note like autumn menu'
          git push
