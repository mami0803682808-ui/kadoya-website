name: Remove sashimi menu card

on:
  push:
    paths:
      - '.github/workflows/remove-sashimi.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove sashimi teishoku card
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new, n = re.subn(r'<article id="sashimi-photo".*?</article>', '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected 1 sashimi card, found {n}')
          p.write_text(new, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove sashimi teishoku from menu"
          git push

# Trigger after workflow is present on the default branch.
