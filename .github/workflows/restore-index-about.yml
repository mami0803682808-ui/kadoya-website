name: Restore index and update about copy

on:
  push:
    paths:
      - '.github/workflows/restore-index-about.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full index and update requested sentence
        run: |
          git show 1cccfd6d70c80d6894d654c3941ef40c0b0dd9a7:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '黒竹をあしらった、落ち着きのある店内。おひとりでも、ご家族やご友人とでも、ゆっくりお過ごしください。'
          new = '黒竹をあしらった、落ち着きのある店内。カウンター席で気軽にひとりごはんも、お座敷でご家族やご友人との食事も。普段使いから、みんなで囲む食卓まで、思い思いにお過ごしいただけます。'
          if old not in s:
              raise SystemExit('Target sentence not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit restored index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore full index and update about wording"
          git push
