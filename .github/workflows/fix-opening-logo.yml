name: Fix opening logo

on:
  push:
    paths:
      - '.github/workflows/fix-opening-logo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace fragile SVG mask with authentic logo crops
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          start = html.find('<div class="arrival-signature"')
          end_marker = '    <div class="scroll-cue signature-cue"'
          end = html.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Opening signature block not found')

          replacement = '''<div class="arrival-signature" aria-hidden="true">
  <div class="arrival-mark authentic-opening-mark">
    <span class="opening-logo-piece opening-logo-crest"><img src="images/kadoya-logo.png" alt=""></span>
    <span class="opening-logo-piece opening-logo-kaku"><img src="images/kadoya-logo.png" alt=""></span>
    <span class="opening-logo-piece opening-logo-ya"><img src="images/kadoya-logo.png" alt=""></span>
  </div>
</div>
'''
          html = html[:start] + replacement + html[end:]
          html_path.write_text(html, encoding='utf-8')

          css_path = Path('style.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* AUTHENTIC OPENING LOGO - SAFARI SAFE */'
          if marker not in css:
              css += r'''

/* AUTHENTIC OPENING LOGO - SAFARI SAFE */
.authentic-opening-mark{
  width:70px!important;
  height:auto!important;
  padding:0!important;
  background:none!important;
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  justify-content:center!important;
  gap:7px!important;
  overflow:visible!important;
}
.opening-logo-piece{
  position:relative!important;
  display:block!important;
  flex:none!important;
  overflow:hidden!important;
}
.opening-logo-piece img{
  position:absolute!important;
  display:block!important;
  max-width:none!important;
  object-fit:unset!important;
  opacity:1!important;
  filter:brightness(0) saturate(100%) invert(76%) sepia(34%) saturate(520%) hue-rotate(359deg) brightness(91%) contrast(88%)!important;
}
.opening-logo-crest{width:70px!important;height:70px!important;border-radius:50%!important}
.opening-logo-crest img{width:258.4px!important;height:93.4px!important;left:-11.8px!important;top:-11.8px!important}
.opening-logo-kaku{width:70px!important;height:76.2px!important}
.opening-logo-kaku img{width:233.6px!important;height:84.45px!important;left:-69.44px!important;top:-3.92px!important}
.opening-logo-ya{width:70px!important;height:66.1px!important}
.opening-logo-ya img{width:202.8px!important;height:73.3px!important;left:-126.4px!important;top:-3.4px!important}
.scroll-ready .authentic-opening-mark{padding:0!important;background:none!important}
@media(min-width:761px){
  .authentic-opening-mark{transform:scale(1.1)!important;transform-origin:center!important}
}
'''
              css_path.write_text(css, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use Safari-safe authentic gold opening logo"
            git push
          fi