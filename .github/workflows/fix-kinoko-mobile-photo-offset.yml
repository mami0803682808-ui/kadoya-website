name: Fix kinoko mobile photo offset

on:
  push:
    paths:
      - '.github/workflows/fix-kinoko-mobile-photo-offset.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align mushroom tempura photo without moving title
        run: |
          cat >> style.css <<'EOF'

/* 2026-10-01: align mushroom tempura photo with Matsutake on mobile while keeping title position unchanged */
@media(max-width:760px){
  #autumn-menu [data-kinoko-tempura-autumn] > img{
    transform:translateY(14px)!important;
    margin-bottom:-4px!important;
  }
}
EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r'style\.css\?v=[^"\']+', 'style.css?v=20261001-2105', s, count=1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html
          git diff --cached --quiet || git commit -m "Align mushroom tempura photo on mobile"
          git push
