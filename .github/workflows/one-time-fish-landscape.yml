name: One-time fish landscape fix
on:
  push:
    paths:
      - '.github/workflows/one-time-fish-landscape.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep fish set photo landscape without cropping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<article class="card reveal"><img src="images/menu-06-sakana.jpg" alt="本日のお魚定食" loading="lazy">'
          new='<article id="fish-set-photo" class="card reveal"><img src="images/menu-06-sakana.jpg" alt="本日のお魚定食" loading="lazy">'
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          css=Path('style.css')
          c=css.read_text(encoding='utf-8')
          c += '''\n/* Daily fish set: match the other set-meal cards while preserving the full landscape photo */\n#fish-set-photo{min-width:0!important}\n#fish-set-photo img{display:block!important;width:100%!important;aspect-ratio:4/3!important;height:auto!important;object-fit:contain!important;object-position:center!important}\n'''
          css.write_text(c,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-fish-landscape.yml
          git add index.html style.css
          git commit -m "Keep fish set photo landscape"
          git push
