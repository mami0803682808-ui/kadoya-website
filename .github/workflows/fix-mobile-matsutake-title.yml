name: Fix mobile matsutake title

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-matsutake-title.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile title fix and bust CSS cache
        shell: bash
        run: |
          cat >> style.css <<'CSS'

          /* 2026-10-01 20:37 definitive mobile Matsutake title visibility fix */
          @media(max-width:760px){
            #autumn-menu .matsutake-gozen-name{
              display:block!important;
              width:100%!important;
              max-width:100%!important;
              min-width:0!important;
              height:auto!important;
              min-height:3.1em!important;
              overflow:visible!important;
              white-space:normal!important;
              font-size:14px!important;
              line-height:1.5!important;
              margin:8px 0!important;
            }
            #autumn-menu .matsutake-gozen-name .matsutake-line{
              display:block!important;
              width:100%!important;
              max-width:100%!important;
              white-space:normal!important;
              overflow:visible!important;
              overflow-wrap:anywhere!important;
              word-break:normal!important;
            }
          }
          CSS
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          import re
          s = re.sub(r'href="style\.css\?v=[^"]+"', 'href="style.css?v=20261001-2037"', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile matsutake title visibility"
          git push
