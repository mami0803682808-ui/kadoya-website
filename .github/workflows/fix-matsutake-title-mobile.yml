name: Fix Matsutake title mobile
on:
  push:
    paths:
      - .github/workflows/fix-matsutake-title-mobile.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile Matsutake title wrapping
        run: |
          cat >> style.css <<'EOF'

/* 2026-10-01 mobile definitive Matsutake title fix */
@media(max-width:760px){
  #autumn-menu .cards{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
  }
  #autumn-menu .card{
    min-width:0!important;
    width:100%!important;
    overflow:hidden!important;
  }
  #autumn-menu .matsutake-gozen-name{
    display:block!important;
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    white-space:normal!important;
    word-break:normal!important;
    overflow-wrap:anywhere!important;
    line-break:auto!important;
    font-size:15px!important;
    line-height:1.45!important;
    min-height:2.9em!important;
    margin:8px 0!important;
  }
}
EOF
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "Fix Matsutake title wrapping on mobile"
          git push
