name: One-time align cheese note
on:
  push:
    paths:
      - '.github/workflows/one-time-align-cheese-note.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align cheese topping note with seasonal cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<h3 class="cheese-katsu-name">チーズカツカレー煮込みきしめん</h3><p class="dish-price">1,660円</p><p class="menu-note">トッピング：チーズ ＋150円 ／ 串カツ1本 ＋180円</p>'
          new='<h3 class="cheese-katsu-name">チーズカツカレー煮込みきしめん</h3><p class="menu-note">トッピング：チーズ ＋150円 ／ 串カツ1本 ＋180円</p><p class="dish-price">1,660円</p>'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-align-cheese-note.yml
          git add index.html
          git commit -m "Align cheese curry topping note position"
          git push
