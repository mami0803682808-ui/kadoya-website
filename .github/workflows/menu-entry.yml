name: Refresh menu landing page
on:
  push:
    branches: [main]
    paths: ['index.html', 'scripts/build-menu-entry.py', 'menu-entry.css', '.github/workflows/menu-entry.yml']
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *' # 06:15 JST: also catches source commits made by Actions.
permissions:
  contents: write
concurrency:
  group: seo-data
  cancel-in-progress: false
jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate menu from current homepage
        run: python scripts/build-menu-entry.py
      - name: Save generated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(menu): refresh landing page from homepage'
          git pull --rebase origin main
          git push
