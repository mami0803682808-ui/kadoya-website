name: Fix Matsutake title mobile
on:
  push:
    paths:
      - .github/workflows/test-minimal.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf '%s\n' '@media(max-width:760px){#autumn-menu .cards{grid-template-columns:repeat(2,minmax(0,1fr))!important}#autumn-menu .card{min-width:0!important;width:100%!important;overflow:hidden!important}#autumn-menu .matsutake-gozen-name{display:block!important;width:100%!important;max-width:100%!important;min-width:0!important;white-space:normal!important;word-break:normal!important;overflow-wrap:anywhere!important;line-break:auto!important;font-size:15px!important;line-height:1.45!important;min-height:2.9em!important;margin:8px 0!important}}' >> style.css
      - run: git config user.name github-actions && git config user.email actions@github.com && git add style.css && git commit -m 'Fix Matsutake title wrapping on mobile' && git push
