name: Fix menu image taps
on:
  push:
    paths:
      - .github/workflows/test-minimal.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo '#menu a.card-photo,#menu a.card-photo *{pointer-events:none!important}' >> style.css
      - run: git config user.name github-actions && git config user.email actions@github.com && git add style.css && git commit -m 'Disable menu photo links' && git push
