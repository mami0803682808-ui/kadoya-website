name: Disable menu image links

on:
  push:
    paths:
      - '.github/workflows/disable-image-clicks.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable menu image clicks
        shell: bash
        run: |
          cat >> style.css <<'EOF'

/* Menu photos are display-only; tapping them must not open standalone image pages. */
#menu a.card-photo,
#menu a.card-photo * {
  pointer-events: none !important;
}
EOF
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "Disable menu photo click-through"
          git push
