name: Make meat and ume kishimen visible
on:
  push:
    paths:
      - '.github/workflows/one-time-kishimen-visible.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move cards up and use direct image URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://drive.google.com/thumbnail?id=1IdCQ9SdQmLnLPcfD6SgbrEf77DKm3Drt&sz=w1600','https://drive.google.com/uc?export=view&id=1IdCQ9SdQmLnLPcfD6SgbrEf77DKm3Drt')
          s=s.replace('https://drive.google.com/thumbnail?id=1r7NS6bBkzGPhM9fqh_zSQWHt4WSQy_ZH&sz=w1600','https://drive.google.com/uc?export=view&id=1r7NS6bBkzGPhM9fqh_zSQWHt4WSQy_ZH')
          patterns=[]
          for name in ['肉きしめん','梅おろしきしめん']:
              m=re.search(r'<article class="card"><img[^>]+alt="'+re.escape(name)+r'".*?</article>',s,re.S)
              if m:
                  patterns.append(m.group(0))
                  s=s[:m.start()]+s[m.end():]
          if patterns:
              marker='<div class="nested-menu-photo cards summer-photo-grid">'
              s=s.replace(marker, marker+''.join(patterns), 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-kishimen-visible.yml
          git add index.html
          git commit -m 'Show meat and ume-oroshi kishimen prominently'
          git push
