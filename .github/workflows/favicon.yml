name: Setup Kadoya favicon

on:
  push:
    paths:
      - '.github/workflows/favicon.yml'

permissions:
  contents: write

jobs:
  setup-favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create favicon from Kadoya crest and update HTML
        shell: bash
        run: |
          set -e
          convert images/kadoya-logo.png -crop 565x565+95+95 +repage -resize 512x512 -channel RGB -fill '#D6B25E' -colorize 100% \( -size 512x512 xc:none -fill white -draw "circle 256,256 256,12" \) -compose DstIn -composite -background '#111111' -alpha background -flatten favicon.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<link rel="icon" type="image/png" href="favicon.png?v=20261001-gold">'
          if 'rel="icon"' not in s:
              s = s.replace('<title>角屋｜小牧の和食麺処</title>', '<title>角屋｜小牧の和食麺処</title>\n' + tag, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit favicon
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.png index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use Kadoya crest as favicon"
          git push
