name: One-time menu fixes
on:
  push:
    paths:
      - '.github/workflows/one-time-menu-fixes.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix menu cards and labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def update_card_image(text, url):
              global s
              pat=re.compile(r'(<article\b[^>]*>)(?:(?!</article>).)*?(<h3\b[^>]*>\s*'+re.escape(text)+r'\s*</h3>)(?:(?!</article>).)*?</article>', re.S)
              m=pat.search(s)
              if not m: return False
              block=m.group(0)
              if '<img' in block:
                  block=re.sub(r'(<img\b[^>]*\bsrc=")[^"]*(")', r'\1'+url+r'\2', block, count=1)
                  block=re.sub(r'(<a\b[^>]*\bhref=")[^"]*(")', r'\1'+url+r'\2', block, count=1)
              else:
                  block=block.replace(m.group(2), f'<a class="card-photo" href="{url}" target="_blank" rel="noopener"><img src="{url}" alt="{text}" loading="lazy"></a>'+m.group(2),1)
              s=s[:m.start()]+block+s[m.end():]
              return True

          update_card_image('梅おろしきしめん','https://drive.google.com/thumbnail?id=1r7NS6bBkzGPhM9fqh_zSQWHt4WSQy_ZH&sz=w1600')
          update_card_image('肉きしめん','https://drive.google.com/thumbnail?id=1IdCQ9SdQmLnLPcfD6SgbrEf77DKm3Drt&sz=w1600')

          # Ensure summer menu text entries exist.
          if '国産とり天' not in s or 'きのこの天ぷら（舞茸・椎茸・えのき茸）' not in s:
              marker='<summary>夏季限定</summary>'
              add='''<dl class="menu-list summer-extra-menu"><div><dt>国産とり天</dt><dd>530円</dd></div><div><dt>きのこの天ぷら（舞茸・椎茸・えのき茸）</dt><dd>680円</dd></div></dl>'''
              if marker in s:
                  s=s.replace(marker,marker+add,1)

          # Add ham toast under morning food/light-meal section.
          if 'ハムトースト' not in s:
              marker='<summary>朝のお食事・軽食</summary>'
              add='<dl class="menu-list"><div><dt>ハムトースト</dt><dd>800円</dd></div></dl>'
              if marker in s:
                  s=s.replace(marker,marker+add,1)

          p.write_text(s,encoding='utf-8')
          PY

          cat >> style.css <<'CSS'

/* Keep one-dish photo-card typography consistent, including tofu dengaku. */
.menu-tab-panel[data-menu-panel="side"] .card h3,
.menu-tab-panel[data-menu-panel="side"] .card .dish-name{
  font-family:inherit!important;
  font-weight:600!important;
  letter-spacing:.02em!important;
}
CSS
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-menu-fixes.yml
          git add index.html style.css
          git commit -m "Show summer dish photos and tidy menu labels"
          git push
