name: SEO Rank Watch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-rank-watch.yml'
  workflow_dispatch:
    inputs:
      days:
        description: "GSC lookback days"
        required: false
        default: "28"
  schedule:
    - cron: "15 22 * * *" # 07:15 JST daily

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check GSC credentials
        id: gsc
        shell: bash
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
        run: |
          if [ -z "$GSC_CLIENT_EMAIL" ] || [ -z "$GSC_PRIVATE_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Google Search Console credentials are missing. Configure GSC_CLIENT_EMAIL and GSC_PRIVATE_KEY in repository Actions secrets."
            echo "### 順位取得は未実行" >> "$GITHUB_STEP_SUMMARY"
            echo "GSC_CLIENT_EMAIL または GSC_PRIVATE_KEY が未設定です。GitHub Actions Secrets を設定してください。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch GSC ranks
        if: steps.gsc.outputs.ready == 'true'
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: "sc-domain:komaki-kadoya.com"
        run: |
          DAYS="${{ github.event.inputs.days || '28' }}"
          node .claude/skills/seo-rank-watch/scripts/fetch_gsc_ranks.mjs \
            --repo "$GITHUB_WORKSPACE" --days "$DAYS" --append

      - name: Commit rank history
        if: steps.gsc.outputs.ready == 'true'
        run: |
          if git diff --quiet -- data/seo/rank-history.json; then
            echo "No rank-history change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seo/rank-history.json
          git commit -m "chore(seo): append GSC rank snapshot"
          git push
