name: One-time fish duplicate cleanup
on:
  push:
    paths:
      - '.github/workflows/one-time-fish-photo-size.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate fish menu row
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<dl class="menu-list"><div><dt>本日のお魚定食（赤だし付）</dt><dd>1,890円</dd></div></dl>'
          if old in s:
              s=s.replace(old,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-fish-photo-size.yml
          git add index.html
          git commit -m "Remove duplicate daily fish set row"
          git push
