name: One-time fix kishimen photos
on:
  push:
    paths:
      - '.github/workflows/one-time-fix-kishimen-photos.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actual kishimen photos
        run: |
          set -e
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1IdCQ9SdQmLnLPcfD6SgbrEf77DKm3Drt' -O images/niku-kishimen.jpg
          gdown 'https://drive.google.com/uc?id=1r7NS6bBkzGPhM9fqh_zSQWHt4WSQy_ZH' -O images/ume-oroshi-kishimen.jpg
          file images/niku-kishimen.jpg images/ume-oroshi-kishimen.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://drive.google.com/thumbnail?id=1IdCQ9SdQmLnLPcfD6SgbrEf77DKm3Drt&sz=w1600','images/niku-kishimen.jpg')
          s=s.replace('https://drive.google.com/thumbnail?id=1r7NS6bBkzGPhM9fqh_zSQWHt4WSQy_ZH&sz=w1600','images/ume-oroshi-kishimen.jpg')
          p.write_text(s,encoding='utf-8')
          for img in [Path('images/niku-kishimen.jpg'), Path('images/ume-oroshi-kishimen.jpg')]:
              b=img.read_bytes()
              if not b.startswith(b'\xff\xd8\xff'):
                  raise SystemExit(f'{img} is not a JPEG')
          PY
      - name: Commit real photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-fix-kishimen-photos.yml
          git add index.html images/niku-kishimen.jpg images/ume-oroshi-kishimen.jpg
          git commit -m 'Store meat and ume-oroshi kishimen photos locally'
          git push
