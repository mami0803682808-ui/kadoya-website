name: One-time kishimen image source fix
on:
  push:
    paths:
      - '.github/workflows/one-time-kishimen-drive-src.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point kishimen cards to working Drive thumbnails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('src="images/niku-kishimen.jpg" alt="肉きしめん"','src="https://drive.google.com/thumbnail?id=1IdCQ9SdQmLnLPcfD6SgbrEf77DKm3Drt&sz=w1600" alt="肉きしめん"')
          s=s.replace('src="images/ume-oroshi-kishimen.jpg" alt="梅おろしきしめん"','src="https://drive.google.com/thumbnail?id=1r7NS6bBkzGPhM9fqh_zSQWHt4WSQy_ZH&sz=w1600" alt="梅おろしきしめん"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-kishimen-drive-src.yml
          git add index.html
          git commit -m 'Display meat and ume-oroshi kishimen photos'
          git push
