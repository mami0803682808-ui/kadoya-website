name: One-time menu cleanup
on: [push]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicate rows
        shell: bash
        run: |
          python3 -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(); names=['コーラフローズン レモンサワークーリッ酒〈お酒〉','オレンジフローズン グレフルサワークーリッ酒〈お酒〉','杏仁バニラクーリッ酒〈お酒〉','コーラフロート','メロンフロート','自家製赤しそフロート','コーヒーフロート','リッチ抹茶フラッペ']; [None for n in names if not (s:=re.sub(r'<div><dt>'+re.escape(n)+r'</dt><dd>[^<]*</dd></div>','',s))]; p.write_text(s)"
          cat >> style.css <<'EOF'

/* Drink photo cards: compact sizing */
.float-photo-grid{max-width:860px!important;margin-left:auto!important;margin-right:auto!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:18px!important}
.float-photo-grid .card img{height:170px!important;object-fit:cover!important}
.float-photo-grid .card h3{font-size:17px!important;line-height:1.55!important}
.float-photo-grid .dish-price{font-size:18px!important}
@media(max-width:760px){.float-photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important}.float-photo-grid .card img{height:120px!important}.float-photo-grid .card h3{font-size:14px!important}.float-photo-grid .dish-price{font-size:16px!important}}
EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git commit -m "Remove duplicate drink rows and compact drink photos"
          git push
