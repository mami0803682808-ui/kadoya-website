name: Fix desktop hours anchor

on:
  push:
    paths:
      - '.github/workflows/fix-desktop-hours-anchor.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop hours anchor fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          a = "        const headerHeight = header?.getBoundingClientRect().height || 92;"
          b = "        const isDesktop = window.matchMedia('(min-width: 761px)').matches;\n        const headerOffset = isDesktop ? 24 : (header?.getBoundingClientRect().height || 64) + 16;"
          c = "        const targetTop = hoursTarget.getBoundingClientRect().top + window.scrollY - headerHeight - 16;"
          d = "        const targetTop = hoursTarget.getBoundingClientRect().top + window.scrollY - headerOffset;"
          if a not in s or c not in s:
              raise SystemExit('desktop hours anchor source lines not found')
          s = s.replace(a, b, 1).replace(c, d, 1)
          p.write_text(s, encoding='utf-8')

          h = Path('index.html')
          t = h.read_text(encoding='utf-8')
          t = t.replace('<script defer src="script.js"></script>', '<script defer src="script.js?v=20261001-2210"></script>', 1)
          t = t.replace('<script defer src="script.js?v=20261001-2201"></script>', '<script defer src="script.js?v=20261001-2210"></script>', 1)
          h.write_text(t, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix desktop hours navigation target"
          git push
