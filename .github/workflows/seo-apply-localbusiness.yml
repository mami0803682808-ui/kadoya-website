name: SEO Apply LocalBusiness

on:
  push:
    paths:
      - ".github/workflows/seo-apply-localbusiness.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Restaurant structured data
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script type="application/ld+json" id="kadoya-restaurant-schema">'
          if marker in s:
              print('schema already present')
              raise SystemExit(0)
          block = '''<script type="application/ld+json" id="kadoya-restaurant-schema">
          {
            "@context": "https://schema.org",
            "@type": "Restaurant",
            "@id": "https://komaki-kadoya.com/#restaurant",
            "name": "角屋",
            "url": "https://komaki-kadoya.com/",
            "image": "https://komaki-kadoya.com/images/kadoya-hands.jpg",
            "telephone": "+81-568-72-2127",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "久保一色1038-1",
              "addressLocality": "小牧市",
              "addressRegion": "愛知県",
              "addressCountry": "JP"
            },
            "servesCuisine": ["きしめん", "和食", "定食"],
            "sameAs": ["https://www.instagram.com/komaki_kadoya/"]
          }
          </script>
          '''
          s = s.replace('</head>', block + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat(seo): add Restaurant structured data"
          git push
