name: One-time payment label fix
on:
  push:
    paths:
      - '.github/workflows/one-time-layout-menu-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update payment label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('現金・クレジットカード・え〜なも券','現金・クレジットカード・こまきプレミアム商品券・こまペイ')
          s = s.replace('現金・クレジットカード・地域振興券','現金・クレジットカード・こまきプレミアム商品券・こまペイ')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-layout-menu-fix.yml
          git add index.html
          git commit -m "Update accepted payment labels"
          git push
