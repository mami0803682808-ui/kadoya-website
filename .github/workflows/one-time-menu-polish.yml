name: One-time menu polish
on:
  push:
    paths:
      - '.github/workflows/one-time-menu-polish.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download provided kishimen photos
        run: |
          curl -L --fail 'https://drive.google.com/uc?export=download&id=1r7NS6bBkzGPhM9fqh_zSQWHt4WSQy_ZH' -o images/ume-oroshi-kishimen.jpg || true
          curl -L --fail 'https://drive.google.com/uc?export=download&id=1IdCQ9SdQmLnLPcfD6SgbrEf77DKm3Drt' -o images/niku-kishimen.jpg || true
      - name: Patch menu HTML and CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Put today's fish set inside the same card grid as the other set meals.
          old='<details class="menu-group"><summary>定食</summary><div class="nested-menu-photo"><article class="card reveal"><img src="images/menu-06-sakana.jpg" alt="本日のお魚定食" loading="lazy"><h3>本日のお魚定食</h3><p class="dish-price">1,890円</p></article></div><div class="nested-set-photos cards">'
          new='<details class="menu-group"><summary>定食</summary><div class="nested-set-photos cards"><article class="card reveal"><img src="images/menu-06-sakana.jpg" alt="本日のお魚定食" loading="lazy"><h3>本日のお魚定食</h3><p class="dish-price">1,890円</p></article>'
          s=s.replace(old,new,1)

          # Make ume-oroshi and meat kishimen use local images when downloaded.
          s=s.replace('https://drive.google.com/thumbnail?id=1r7NS6bBkzGPhM9fqh_zSQWHt4WSQy_ZH&sz=w1600','images/ume-oroshi-kishimen.jpg')
          s=s.replace('https://drive.google.com/thumbnail?id=1IdCQ9SdQmLnLPcfD6SgbrEf77DKm3Drt&sz=w1600','images/niku-kishimen.jpg')

          # Remove text-list duplicates when the same kishimen already has a photo card.
          duplicates=[
            '田縣たぬききしめん〈冷〉','きしめん〈温・冷〉','天ぷらきしめん〈温・冷〉',
            'とり天きしめん〈温・冷〉','山菜きしめん〈温・冷〉','あんかけ卵とじきしめん〈温〉',
            'カレーきしめん〈温〉','天ざるきしめん〈冷〉'
          ]
          for name in duplicates:
            s=re.sub(r'<div><dt>'+re.escape(name)+r'</dt><dd>.*?</dd></div>','',s,count=1)

          # Add ham toast to morning food if not already present.
          if 'ハムトースト' not in s:
            marker='<summary>朝のお食事・軽食</summary>'
            if marker in s:
              s=s.replace(marker,marker+'<dl class="menu-list"><div><dt>ハムトースト</dt><dd>800円</dd></div></dl>',1)

          # Ensure summer tempura items are present as menu entries.
          summer='<summary>夏季限定</summary>'
          if summer in s and '国産とり天</dt><dd>530円' not in s:
            s=s.replace(summer,summer+'<dl class="menu-list summer-tempura-menu"><div><dt>国産とり天</dt><dd>530円</dd></div><div><dt>きのこの天ぷら（舞茸・椎茸・えのき茸）</dt><dd>680円</dd></div></dl>',1)

          # Tidy the morning drink note.
          s=s.replace('モーニングのお飲み物は、下のモーニング専用メニューをご覧ください。','モーニングのお飲み物は、モーニング専用メニューをご覧ください。')
          p.write_text(s,encoding='utf-8')

          css=Path('style.css')
          c=css.read_text(encoding='utf-8')
          marker='/* 2026-09-30 menu polish */'
          if marker not in c:
            c += '''\n/* 2026-09-30 menu polish */\n.side-dish-grid .dish-photo-item h3,\n.side-dish-grid .dish-photo-item h4{font-family:inherit!important;font-size:inherit!important;font-weight:600!important;letter-spacing:.02em!important;}\n@media(min-width:761px){\n  .float-photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:18px!important;max-width:900px!important;margin-left:auto!important;margin-right:auto!important;}\n  .float-photo-grid .card img{width:100%!important;aspect-ratio:4/3!important;object-fit:cover!important;max-height:180px!important;}\n  .nested-set-photos.cards{grid-template-columns:repeat(3,minmax(0,1fr))!important;}\n  .nested-set-photos.cards .card img{width:100%!important;aspect-ratio:4/3!important;object-fit:cover!important;}\n  .kishimen-extra-photos{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:18px!important;}\n  .kishimen-extra-photos .card img{width:100%!important;aspect-ratio:4/3!important;object-fit:cover!important;}\n  #tenzaru-kishimen-photo,\n  #tenzaru-kishimen-photo + *{max-width:none!important;}\n  #tenzaru-kishimen-photo img,\n  .nested-menu-photo .card img[alt="きしめん"]{width:100%!important;aspect-ratio:4/3!important;object-fit:cover!important;}\n}\n'''
          css.write_text(c,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-menu-polish.yml
          git add index.html style.css images/ume-oroshi-kishimen.jpg images/niku-kishimen.jpg || true
          git commit -m "Polish menu photos, sizes, and duplicates"
          git push
